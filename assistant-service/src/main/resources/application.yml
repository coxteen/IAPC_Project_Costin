server:
  port: 8082

spring:
  application:
    name: assistant-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/photopulse_db
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.1 # Lower temperature for more deterministic responses
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: camera_manuals
        initialize-schema: false # Collection is already created by ingestion service
    
    app:
      reranker:
        enabled: ${APP_RERANKER_ENABLED:true}
        top-n: ${APP_RERANK_TOP_N:20}
        top-k: ${APP_RERANK_TOP_K:5}
        model-version: ${APP_RERANKER_MODEL_VERSION:BAAI/bge-reranker-v2-m3@rev-2025.10}
        endpoint-url: ${APP_RERANKER_URL:http://localhost:11434/api/rerank}
        timeout-ms: ${APP_RERANKER_TIMEOUT_MS:3000}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true