server:
  port: 8081

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5433/photopulse_db
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: ${APP_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: camera_manuals
        initialize-schema: true

app:
  ingestion:
    chunk-size: ${APP_CHUNK_SIZE:250}
    chunk-overlap: ${APP_CHUNK_OVERLAP:50}
    parent-chunk-size: ${APP_PARENT_CHUNK_SIZE:1000}
    min-chunk-size-chars: ${APP_MIN_CHUNK_SIZE_CHARS:80}
    embedding-model: ${APP_EMBEDDING_MODEL:nomic-embed-text}
    batch-size: ${APP_INGESTION_BATCH_SIZE:20}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true