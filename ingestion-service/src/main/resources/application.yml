server:
  port: 8081

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true # Java Virtual Threads for parralel processing of the PDFs
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://localhost:5433/photopulse_db
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334 # gRPC port for Qdrant
        collection-name: camera_manuals
        initialize-schema: true # Automatically create the collection in Qdrant on startup

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true