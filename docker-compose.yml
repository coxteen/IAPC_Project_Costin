services:
  postgres:
    image: postgres:16-alpine
    container_name: photopulse-postgres
    environment:
      POSTGRES_DB: photopulse_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - photopulse-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: photopulse-qdrant
    ports:
      - "6333:6333" # REST API & Web UI (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC (used by de Spring AI)
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - photopulse-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: photopulse-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - photopulse-net

  nginx:
    image: nginx:alpine
    container_name: photopulse-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
      - keycloak
    networks:
      - photopulse-net

volumes:
  postgres_data:
  qdrant_data:

networks:
  photopulse-net:
    driver: bridge