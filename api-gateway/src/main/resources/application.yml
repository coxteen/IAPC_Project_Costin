server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: ingestion-service-route
              uri: lb://ingestion-service
              predicates:
                - Path=/api/v1/ingestion/**
            - id: assistant-service-route
              uri: lb://assistant-service
              predicates:
                - Path=/api/v1/assistant/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true